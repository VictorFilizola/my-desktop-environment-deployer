general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = killall hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 3000              # 50 min inactivity
    on-timeout = hyprlock      # lock screen
}

listener {
    timeout = 6000              # 100 min
    on-timeout = hyprctl dispatch dpms off   # turn off displays
}

listener {
    timeout = 9000              # 150 min
    on-timeout = systemctl suspend           # suspend
}
